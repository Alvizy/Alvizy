<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Profile.Name}} — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Manrope (primary) + Playfair Display italic (accent only) + JetBrains Mono (meta) -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300,0&display=swap" rel="stylesheet">

  <style>
    /* ─── Reset ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ::-webkit-scrollbar { display: none; }
    ::selection { background: rgba(223,48,72,0.25); color: #fff; }

    /* ─── Design Tokens ─── */
    :root {
      /* Colors */
      --bg:         #080809;
      --bg2:        #111114;
      --surface:    #18181D;
      --text:       #F4F4F5;
      --text-2:     #92929A;
      --text-3:     rgba(244,244,245,0.35);
      --red:        #DF3048;
      --red-dim:    rgba(223,48,72,0.12);
      --red-glow:   rgba(223,48,72,0.22);
      --border:     rgba(255,255,255,0.08);
      --border-hi:  rgba(255,255,255,0.13);

      /* Typography */
      --f-sans:     'Manrope', -apple-system, sans-serif;
      --f-accent:   'Playfair Display', Georgia, serif;
      --f-mono:     'JetBrains Mono', monospace;

      /* Spacing (8px base) */
      --s2:  0.5rem;   /* 8px  */
      --s3:  0.75rem;  /* 12px */
      --s4:  1rem;     /* 16px */
      --s6:  1.5rem;   /* 24px */
      --s8:  2rem;     /* 32px */
      --s10: 2.5rem;   /* 40px */
      --s12: 3rem;     /* 48px */
      --s16: 4rem;     /* 64px */

      /* Transitions */
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ─── Base ─── */
    html { height: 100%; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--f-sans);
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    /* ─── Header ─── */
    .header {
      height: 3.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--s10);
      border-bottom: 1px solid var(--border);
      background: rgba(8,8,9,0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      z-index: 40;
      flex-shrink: 0;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }
    .brand:hover { color: #fff; }

    .header-badge {
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: 0.25rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: 9999px;
      background: rgba(255,255,255,0.03);
      font-family: var(--f-mono);
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-2);
    }

    .dot-live {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--red);
      animation: breathe 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes breathe {
      0%,100% { opacity: 1; box-shadow: 0 0 4px var(--red); }
      50%      { opacity: 0.45; box-shadow: none; }
    }

    /* ─── HERO (desktop: 2-col grid) ─── */
    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }

    /* Atmospheric background glows */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 80% at 75% 45%, rgba(223,48,72,0.14) 0%, transparent 60%),
        radial-gradient(ellipse 35% 50% at 15% 85%, rgba(255,255,255,0.015) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Left: Copy ─── */
    .hero-copy {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 var(--s12) 0 var(--s10);
      gap: var(--s6);
    }

    .hero-label {
      display: flex;
      align-items: center;
      gap: var(--s3);
      font-family: var(--f-mono);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--red);
    }
    .hero-label::before {
      content: '';
      display: block;
      width: 1.25rem;
      height: 1px;
      background: var(--red);
      opacity: 0.6;
    }

    .hero-h1 {
      font-size: clamp(2.5rem, 4.8vw, 5rem);
      font-weight: 800;
      line-height: 1.0;
      letter-spacing: -0.04em;
      color: var(--text);
      text-wrap: balance;
    }
    /* Italic serif accent — ONLY for the name "Fanz" */
    .hero-h1 .accent {
      font-family: var(--f-accent);
      font-style: italic;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .hero-desc {
      font-size: clamp(0.9rem, 1.2vw, 1.05rem);
      font-weight: 300;
      color: var(--text-2);
      line-height: 1.7;
      max-width: 26rem;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: var(--s4);
      flex-wrap: wrap;
    }

    .btn-fill {
      display: inline-flex;
      align-items: center;
      gap: var(--s2);
      padding: 0.75rem 1.625rem;
      background: var(--text);
      color: var(--bg);
      font-family: var(--f-sans);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-decoration: none;
      border-radius: 100px;
      transition: background 0.2s var(--ease), transform 0.2s var(--ease);
      min-height: 44px;
      cursor: pointer;
    }
    .btn-fill:hover { background: #fff; transform: translateY(-1px); }

    .btn-text {
      display: inline-flex;
      align-items: center;
      gap: var(--s2);
      padding: 0.75rem var(--s3);
      color: var(--text-2);
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      border-radius: 100px;
      transition: color 0.2s;
      min-height: 44px;
    }
    .btn-text:hover { color: var(--text); }

    /* ─── Right: Portrait ─── */
    /* ─── Right: Portrait — seamless mask blending ─── */
    .hero-portrait-wrap {
      position: relative;
      z-index: 5;
      overflow: hidden;
      /* Dark red atmospheric depth behind subject */
      background:
        radial-gradient(ellipse 70% 75% at 65% 45%, rgba(160,22,32,0.24) 0%, rgba(100,10,18,0.1) 45%, transparent 70%),
        radial-gradient(ellipse 40% 55% at 88% 80%, rgba(8,8,9,0.9) 0%, transparent 55%);
    }

    /* Subtle left edge divider */
    .hero-portrait-wrap::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.05), transparent);
      z-index: 10;
    }

    /* Portrait — mask-image handles all edge fading, no container box */
    .hero-portrait-wrap img {
      position: absolute;
      right: 0; bottom: 0;
      width: 82%;
      height: 110%;
      object-fit: cover;
      object-position: top center;
      filter: contrast(1.03) brightness(0.92) saturate(0.88);
      display: block;
      z-index: 1;

      /* Left fade: black → transparent → subject
         Bottom fade: subject gradually disappears into darkness
         Right: slight breathing room fade
         Top: very soft fade in */
      -webkit-mask-image:
        linear-gradient(to right,
          transparent  0%,
          rgba(0,0,0,0.0) 3%,
          rgba(0,0,0,0.45) 16%,
          black        34%,
          black        82%,
          rgba(0,0,0,0.6) 93%,
          transparent  100%),
        linear-gradient(to bottom,
          transparent  0%,
          black        7%,
          black        68%,
          rgba(0,0,0,0.35) 84%,
          transparent  100%);
      mask-image:
        linear-gradient(to right,
          transparent  0%,
          rgba(0,0,0,0.0) 3%,
          rgba(0,0,0,0.45) 16%,
          black        34%,
          black        82%,
          rgba(0,0,0,0.6) 93%,
          transparent  100%),
        linear-gradient(to bottom,
          transparent  0%,
          black        7%,
          black        68%,
          rgba(0,0,0,0.35) 84%,
          transparent  100%);
      -webkit-mask-composite: source-in;
      mask-composite: intersect;
    }

    /* Atmospheric overlay — warm rim + bottom vignette, on top of image */
    .hero-portrait-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 28% 40% at 52% 28%, rgba(190,35,40,0.06) 0%, transparent 55%),
        linear-gradient(to right, rgba(8,8,9,0.5) 0%, rgba(8,8,9,0.08) 32%, transparent 55%),
        linear-gradient(to top,   rgba(8,8,9,0.65) 0%, rgba(8,8,9,0.15) 28%, transparent 50%);
      z-index: 2;
      pointer-events: none;
    }

    /* ─── Footer ─── */
    .footer {
      height: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--s10);
      border-top: 1px solid var(--border);
      font-family: var(--f-mono);
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-3);
      flex-shrink: 0;
      position: relative;
      z-index: 40;
    }

    /* ─── Navigation Dock ─── */
    .nav-dock {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      background: rgba(17,17,20,0.82);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--border-hi);
      border-top-color: rgba(255,255,255,0.18);
      border-radius: 9999px;
      box-shadow:
        0 16px 40px -8px rgba(0,0,0,0.75),
        inset 0 1px 0 rgba(255,255,255,0.09);
    }

    .nav-dock a {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 0.875rem;
      border-radius: 9999px;
      font-family: var(--f-sans);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--text-2);
      text-decoration: none;
      transition: color 0.2s var(--ease), background 0.2s var(--ease);
      white-space: nowrap;
      min-height: 36px;
    }
    .nav-dock a:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .nav-dock a.active {
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-hi);
    }
    .nav-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      display: none;
    }
    .nav-dock a.active .nav-dot { display: block; }
    .nav-sep { width: 1px; height: 14px; background: var(--border); flex-shrink: 0; }

    .material-symbols-outlined {
      font-size: 0.95rem !important;
      line-height: 1;
      vertical-align: middle;
      opacity: 0.7;
    }
    .nav-dock a.active .material-symbols-outlined,
    .nav-dock a:hover .material-symbols-outlined { opacity: 1; }

    /* ─── Focus ─── */
    :focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ─── Reduced Motion ─── */
    @media (prefers-reduced-motion: reduce) {
      .dot-live { animation: none; }
      * { transition-duration: 0.01ms !important; }
    }

    /* ────────────────────────────────────────────────
       RESPONSIVE
    ──────────────────────────────────────────────── */

    /* Laptop 1366 */
    @media (max-width: 1366px) {
      .header { padding: 0 var(--s8); }
      .hero-copy { padding: 0 var(--s8) 0 var(--s8); gap: var(--s6); }
      .footer { padding: 0 var(--s8); }
    }

    /* Tablet 768–1023 */
    @media (max-width: 1023px) {
      body { height: auto; overflow: auto; display: flex; flex-direction: column; }

      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      /* Tablet: portrait top, smaller */
      .hero-portrait-wrap {
        order: -1;
        height: 42vw;
        max-height: 340px;
      }
      .hero-portrait-wrap::before { display: none; }
      .hero-portrait-wrap img {
        width: 55%;
        height: 120%;
        right: 0; bottom: 0;
      }

      .hero-copy {
        padding: var(--s6) var(--s8) var(--s8);
        gap: var(--s4);
      }

      .footer { margin-bottom: 5rem; /* room for nav dock */ }
    }

    /* Mobile 390–767 */
    @media (max-width: 767px) {
      .header { padding: 0 var(--s4); height: 3rem; }

      .hero {
        grid-template-columns: 1fr;
        padding-bottom: 5.5rem; /* nav dock clearance */
      }

      /* Mobile: distinct vertical composition */
      .hero-portrait-wrap {
        order: -1;
        height: auto;
        min-height: 0;
        padding: var(--s6) var(--s4) 0;
        justify-content: flex-start;
        align-items: flex-end;
        background: none;
        overflow: visible;
      }
      .hero-portrait-wrap::before { display: none; }

      /* Mobile portrait: small circle avatar */
      .hero-portrait-wrap img {
        position: relative;
        width: 96px;
        height: 96px;
        right: auto; bottom: auto;
        border-radius: 50%;
        object-fit: cover;
        object-position: top center;
        border: 1.5px solid rgba(255,255,255,0.12);
        filter: contrast(1.02) brightness(0.93);
        /* Reset mask on mobile — circular clip via border-radius */
        -webkit-mask-image: none;
        mask-image: none;
        flex-shrink: 0;
      }
      .hero-portrait-wrap::after { display: none; }

      .hero-copy {
        padding: var(--s4) var(--s4) var(--s6);
        gap: var(--s4);
      }

      .hero-h1 {
        font-size: clamp(2rem, 9vw, 2.75rem);
        letter-spacing: -0.03em;
      }

      .hero-desc { font-size: 0.9rem; max-width: 100%; }

      .hero-actions { gap: var(--s3); }

      .btn-fill { padding: 0.75rem 1.375rem; font-size: 0.8rem; }

      .footer { padding: 0 var(--s4); display: none; /* clean on mobile */ }

      /* Compact nav on mobile */
      .nav-dock {
        bottom: env(safe-area-inset-bottom, 0.75rem);
        bottom: max(env(safe-area-inset-bottom), 0.75rem);
        left: var(--s4);
        right: var(--s4);
        transform: none;
        justify-content: space-around;
      }
      .nav-dock a { padding: 0.5rem 0.625rem; gap: 0.25rem; }
      .nav-dock a span:not(.material-symbols-outlined):not(.nav-dot) {
        display: none; /* icon only on mobile */
      }
      .nav-dock a.active span:not(.material-symbols-outlined):not(.nav-dot) {
        display: block; /* show label on active */
        font-size: 0.6rem;
      }
    }

    /* Small mobile 360 */
    @media (max-width: 390px) {
      .hero-h1 { font-size: clamp(1.75rem, 8.5vw, 2.25rem); }
      .nav-dock a { padding: 0.5rem 0.5rem; }
    }
  </style>
</head>
<body>

  <!-- ─── Header ─── -->
  <header class="header">
    <a class="brand" href="/">{{.Profile.Name}}</a>
    <div class="header-badge">
      <span class="dot-live" aria-hidden="true"></span>
      Indonesia · UTC+7
    </div>
  </header>

  <!-- ─── Hero ─── -->
  <main class="hero" aria-label="Hero">

    <!-- Left: Copy -->
    <div class="hero-copy">
      <p class="hero-label" aria-label="Role">Developer · Cyber Security</p>

      <h1 class="hero-h1">
        Hello, I'm<br>
        <span class="accent">{{.Profile.Name}}.</span>
      </h1>

      <p class="hero-desc">{{.Profile.Tagline}}</p>

      <div class="hero-actions">
        <a class="btn-fill" href="/projects">
          View My Works
          <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
        </a>
        <a class="btn-text" href="/contact">
          About Me
          <span class="material-symbols-outlined" aria-hidden="true">arrow_outward</span>
        </a>
      </div>
    </div>

    <!-- Right: Portrait — direct in wrap, mask handles blending -->
    <div class="hero-portrait-wrap" aria-hidden="true">
      <img src="/static/portrait.png"
           alt="{{.Profile.Name}}"
           loading="eager"
           draggable="false">
    </div>
  </main>

  <!-- ─── Footer ─── -->
  <footer class="footer">
    <span>© 2026 {{.Profile.Name}}</span>
    <span>All rights reserved</span>
  </footer>

  <!-- ─── Navigation Dock ─── -->
  <nav class="nav-dock" aria-label="Main navigation">
    <a href="/" class="active" aria-current="page">
      <span class="material-symbols-outlined" aria-hidden="true">home</span>
      <span>Home</span>
      <span class="nav-dot" aria-hidden="true"></span>
    </a>
    <span class="nav-sep" aria-hidden="true"></span>
    <a href="/projects">
      <span class="material-symbols-outlined" aria-hidden="true">grid_view</span>
      <span>Projects</span>
    </a>
    <span class="nav-sep" aria-hidden="true"></span>
    <a href="/about">
      <span class="material-symbols-outlined" aria-hidden="true">terminal</span>
      <span>Skills</span>
    </a>
    <span class="nav-sep" aria-hidden="true"></span>
    <a href="/certificates">
      <span class="material-symbols-outlined" aria-hidden="true">verified</span>
      <span>Certificates</span>
    </a>
    <span class="nav-sep" aria-hidden="true"></span>
    <a href="/contact">
      <span class="material-symbols-outlined" aria-hidden="true">person</span>
      <span>About</span>
    </a>
  </nav>

</body>
</html>
