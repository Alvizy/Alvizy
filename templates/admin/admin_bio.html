<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin — Bio</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="admin-nav">
  <span style="color:var(--cyan);font-weight:700">Admin</span>
  <a href="{{.AdminPath}}">Dashboard</a>
  <a href="{{.AdminPath}}/bio">Bio</a>
  <a href="{{.AdminPath}}/skills">Skills</a>
  <a href="{{.AdminPath}}/projects">Projects</a>
  <a href="/" target="_blank">↗ Lihat Web</a>
  <span class="logout">
    <form method="POST" action="{{.AdminPath}}/logout">
      <button type="submit">Logout</button>
    </form>
  </span>
</div>
<div class="admin-wrap">
  <p class="admin-title">Edit Bio &amp; Profil</p>
  <form method="POST">
    <div class="form-group">
      <label>Nama</label>
      <input type="text" name="name" value="{{.Profile.Name}}" required>
    </div>
    <div class="form-group">
      <label>Tagline</label>
      <input type="text" name="tagline" value="{{.Profile.Tagline}}" placeholder="e.g. Fullstack Developer">
    </div>
    <div class="form-group">
      <label>Bio</label>
      <textarea name="bio">{{.Profile.Bio}}</textarea>
    </div>
    <div class="form-group">
      <label>Location</label>
      <input type="text" name="location" value="{{.Profile.Location}}">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="text" name="email" value="{{.Profile.Email}}">
    </div>
    <div class="form-group">
      <label>GitHub URL</label>
      <input type="text" name="github" value="{{.Profile.Github}}">
    </div>
    <div class="form-group">
      <label>Instagram URL</label>
      <input type="text" name="instagram" value="{{.Profile.Instagram}}">
    </div>
    <div class="form-group">
      <label>LinkedIn URL</label>
      <input type="text" name="linkedin" value="{{.Profile.Linkedin}}">
    </div>
    <div class="form-group">
      <div class="checkbox-row">
        <input type="checkbox" name="available" id="available" {{if .Profile.Available}}checked{{end}}>
        <label for="available">Available for work</label>
      </div>
    </div>
    <button type="submit">Simpan</button>
  </form>
</div>
</body>
</html>
