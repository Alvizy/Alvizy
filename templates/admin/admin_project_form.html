<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin — {{.Action}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="admin-nav">
  <span style="color:var(--cyan);font-weight:700">Admin</span>
  <a href="{{.AdminPath}}">Dashboard</a>
  <a href="{{.AdminPath}}/bio">Bio</a>
  <a href="{{.AdminPath}}/skills">Skills</a>
  <a href="{{.AdminPath}}/projects">Projects</a>
  <a href="/" target="_blank">↗ Lihat Web</a>
  <span class="logout">
    <form method="POST" action="{{.AdminPath}}/logout">
      <button type="submit">Logout</button>
    </form>
  </span>
</div>
<div class="admin-wrap">
  <p class="admin-title">{{.Action}}</p>

  {{$p := .Project}}
  {{if $p.ID}}
  <form method="POST" action="{{$.AdminPath}}/projects/edit/{{$p.ID}}">
  {{else}}
  <form method="POST" action="{{$.AdminPath}}/projects/new">
  {{end}}

    <div class="form-group">
      <label>Judul *</label>
      <input type="text" name="title" value="{{$p.Title}}" required autofocus>
    </div>
    <div class="form-group">
      <label>Deskripsi</label>
      <textarea name="description">{{$p.Description}}</textarea>
    </div>
    <div class="form-group">
      <label>Tech Stack (pisahkan dengan koma)</label>
      <input type="text" name="tech_stack" value="{{$p.TechStack}}" placeholder="Go, PostgreSQL, HTML">
    </div>
    <div class="form-group">
      <label>GitHub URL</label>
      <input type="text" name="github_url" value="{{$p.GithubURL}}">
    </div>
    <div class="form-group">
      <label>Live URL</label>
      <input type="text" name="live_url" value="{{$p.LiveURL}}">
    </div>
    <div class="form-group">
      <div class="checkbox-row">
        <input type="checkbox" name="featured" id="featured" {{if $p.Featured}}checked{{end}}>
        <label for="featured">Featured (tampil di halaman utama)</label>
      </div>
    </div>

    <div style="display:flex;gap:1rem;align-items:center;margin-top:1rem">
      <button type="submit">Simpan</button>
      <a href="{{.AdminPath}}/projects" style="color:var(--muted);font-size:0.8rem">Batal</a>
    </div>
  </form>
</div>
</body>
</html>
